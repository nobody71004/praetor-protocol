[package]
name = "praetor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "PRAETOR/1 post-quantum authenticated transport and enforcement protocol"
license = "MIT"

[lib]
name = "praetor"
path = "src/lib.rs"

[[bin]]
name = "praetor"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
ring = "0.17"
aegis = "0.9"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
scrypt = "0.11"
hex = "0.4"
ml-kem = "0.2"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
