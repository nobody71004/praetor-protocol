<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">PMARINE AEGIS-256 lane variants versus BOLT</title>
  <desc id="desc">Grouped benchmark chart. The PMARINE SIV envelope reaches 1,884.7 to 2,109.2 MiB/s at 60 KB across AEGIS-256, AEGIS-256X2 and AEGIS-256X4. The fixed-cell channel reaches 867.8 to 947.8 MiB/s at 60 KB, or 0.14 to 0.15 times BOLT's 6,246.8 MiB/s. The serial HMAC-SHA256 SIV is the bottleneck.</desc>
  <rect width="1040" height="700" fill="#0b0f12"/>
  <text x="56" y="58" fill="#e7f2ea" font-size="30" font-weight="800" letter-spacing="-0.5">PMARINE / AEGIS lane benchmarks</text>
  <text x="56" y="88" fill="#8fa6a1" font-size="14">Windows x64 · single thread · Rust release · medians of three runs · higher is better</text>
  <g font-size="12" fill="#a9bdb7">
    <rect x="726" y="44" width="13" height="13" rx="3" fill="#5ce1b0"/>
    <text x="747" y="55">seal</text>
    <rect x="796" y="44" width="13" height="13" rx="3" fill="#6aa9ff"/>
    <text x="817" y="55">open</text>
    <rect x="864" y="44" width="13" height="13" rx="3" fill="#c9a2ff"/>
    <text x="885" y="55">BOLT ref.</text>
  </g>
  <line x1="56" y1="112" x2="984" y2="112" stroke="#22323a"/>

  <rect x="40" y="132" width="462" height="388" rx="18" fill="#111a1f" stroke="#22323a"/>
  <text x="64" y="166" fill="#e7f2ea" font-size="19" font-weight="700">60 KB SIV envelope</text>
  <text x="64" y="187" fill="#8fa6a1" font-size="12">AEGIS lanes through the real 80-byte envelope · MiB/s</text>

  <g font-size="12">
    <text x="64" y="229" fill="#c7d8d2" font-weight="600">AEGIS-256</text>
    <text x="64" y="244" fill="#738b85">seal</text>
    <rect x="214" y="216" width="194" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="214" y="216" width="166.2" height="18" rx="5" fill="#5ce1b0"/>
    <text x="418" y="229" fill="#5ce1b0" font-size="12" font-weight="700">1,884.7</text>
    <text x="64" y="277" fill="#738b85">open</text>
    <rect x="214" y="251" width="194" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="214" y="251" width="166.5" height="18" rx="5" fill="#6aa9ff"/>
    <text x="418" y="264" fill="#6aa9ff" font-size="12" font-weight="700">1,888.1</text>

    <text x="64" y="306" fill="#c7d8d2" font-weight="600">AEGIS-256X2</text>
    <text x="64" y="321" fill="#738b85">seal</text>
    <rect x="214" y="293" width="194" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="214" y="293" width="185.5" height="18" rx="5" fill="#5ce1b0"/>
    <text x="418" y="306" fill="#5ce1b0" font-size="12" font-weight="700">2,103.8</text>
    <text x="64" y="354" fill="#738b85">open</text>
    <rect x="214" y="328" width="194" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="214" y="328" width="180.5" height="18" rx="5" fill="#6aa9ff"/>
    <text x="418" y="341" fill="#6aa9ff" font-size="12" font-weight="700">2,047.6</text>

    <text x="64" y="383" fill="#c7d8d2" font-weight="600">AEGIS-256X4</text>
    <text x="64" y="398" fill="#738b85">seal</text>
    <rect x="214" y="370" width="194" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="214" y="370" width="186" height="18" rx="5" fill="#5ce1b0"/>
    <text x="418" y="383" fill="#5ce1b0" font-size="12" font-weight="700">2,109.2</text>
    <text x="64" y="431" fill="#738b85">open</text>
    <rect x="214" y="405" width="194" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="214" y="405" width="184.9" height="18" rx="5" fill="#6aa9ff"/>
    <text x="418" y="418" fill="#6aa9ff" font-size="12" font-weight="700">2,097.3</text>
  </g>
  <text x="64" y="486" fill="#738b85" font-size="12">Lane scaling lifts 60 KB seal throughput by about 12% over AEGIS-256.</text>

  <rect x="524" y="132" width="476" height="388" rx="18" fill="#111a1f" stroke="#22323a"/>
  <text x="548" y="166" fill="#e7f2ea" font-size="19" font-weight="700">Fixed-cell channel</text>
  <text x="548" y="187" fill="#8fa6a1" font-size="12">PMARINE vs BOLT · 60 KB · MiB/s</text>

  <g font-size="12">
    <text x="548" y="229" fill="#c7d8d2" font-weight="600">AEGIS-256</text>
    <text x="548" y="244" fill="#738b85">621,610 rt/s at 1 KiB</text>
    <rect x="708" y="216" width="232" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="708" y="216" width="32.2" height="18" rx="5" fill="#5ce1b0"/>
    <text x="748" y="229" fill="#5ce1b0" font-size="12" font-weight="700">867.8</text>

    <text x="548" y="287" fill="#c7d8d2" font-weight="600">AEGIS-256X2</text>
    <text x="548" y="302" fill="#738b85">627,274 rt/s at 1 KiB</text>
    <rect x="708" y="274" width="232" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="708" y="274" width="34.7" height="18" rx="5" fill="#5ce1b0"/>
    <text x="750" y="287" fill="#5ce1b0" font-size="12" font-weight="700">935.6</text>

    <text x="548" y="345" fill="#c7d8d2" font-weight="600">AEGIS-256X4</text>
    <text x="548" y="360" fill="#738b85">587,889 rt/s at 1 KiB</text>
    <rect x="708" y="332" width="232" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="708" y="332" width="35.2" height="18" rx="5" fill="#5ce1b0"/>
    <text x="750" y="345" fill="#5ce1b0" font-size="12" font-weight="700">947.8</text>

    <text x="548" y="413" fill="#d9c7ff" font-weight="600">BOLT reference</text>
    <text x="548" y="428" fill="#738b85">same run · same CPU</text>
    <rect x="708" y="400" width="232" height="18" rx="5" fill="#152027" stroke="#22323a"/>
    <rect x="708" y="400" width="232" height="18" rx="5" fill="#c9a2ff"/>
    <text x="946" y="413" fill="#c9a2ff" font-size="12" font-weight="700">6,246.8</text>
  </g>
  <text x="548" y="486" fill="#738b85" font-size="12">The channel is 0.14–0.15× BOLT at 1 KiB and 60 KB.</text>

  <g>
    <rect x="40" y="545" width="300" height="82" rx="14" fill="#111a1f" stroke="#22323a"/>
    <text x="60" y="575" fill="#5ce1b0" font-size="20" font-weight="800">0.14–0.15×</text>
    <text x="60" y="599" fill="#8fa6a1" font-size="12">PMARINE channel vs BOLT</text>
    <rect x="354" y="545" width="326" height="82" rx="14" fill="#111a1f" stroke="#22323a"/>
    <text x="374" y="575" fill="#ffc46b" font-size="20" font-weight="800">2,386.9 MiB/s</text>
    <text x="374" y="599" fill="#8fa6a1" font-size="12">serial SIV alone at 60 KB</text>
    <rect x="694" y="545" width="306" height="82" rx="14" fill="#111a1f" stroke="#22323a"/>
    <text x="714" y="575" fill="#6aa9ff" font-size="20" font-weight="800">1,884–2,109</text>
    <text x="714" y="599" fill="#8fa6a1" font-size="12">60 KB seal across three lanes · MiB/s</text>
  </g>
  <text x="56" y="660" fill="#8fa6a1" font-size="12">X2/X4 parallelize AEGIS, not the serial HMAC-SHA256 SIV. PMARINE is a stronger commitment envelope, not a BOLT competitor.</text>
  <text x="56" y="678" fill="#5c726c" font-size="11">Source: pmarine-aegis-bench · 60 KB cells · medians of three runs · no AVX-512.</text>
</svg>
