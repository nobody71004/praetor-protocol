<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="790" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">PRAETOR/1 versus WireGuard on the same CPU</title>
  <desc id="desc">Grouped bar chart of handshakes per second, 1 KiB authenticated roundtrips per second, and 60 KB full-path throughput. WireGuard is boringtun userspace; PRAETOR is the Rust release build.</desc>
  <rect width="1040" height="790" fill="#0b0f12"/>
  <text x="56" y="62" fill="#e7f2ea" font-size="30" font-weight="800" letter-spacing="-0.5">PRAETOR/1 vs WireGuard</text>
  <text x="56" y="92" fill="#8fa6a1" font-size="14">Same machine · single thread · Rust release builds · higher is better</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="826" y="46" width="14" height="14" rx="3" fill="#5ce1b0"/>
    <text x="848" y="58" fill="#e7f2ea" font-size="13">PRAETOR/1 Rust</text>
    <rect x="826" y="70" width="14" height="14" rx="3" fill="#6aa9ff"/>
    <text x="848" y="82" fill="#e7f2ea" font-size="13">WireGuard (boringtun)</text>
  </g>
  <line x1="56" y1="116" x2="984" y2="116" stroke="#22323a"/>
  
  <g>
    <text x="56" y="156" fill="#e7f2ea" font-size="19" font-weight="700">Handshakes per second</text>
    <text x="56" y="178" fill="#8fa6a1" font-size="13">complete Noise / hybrid handshake · ops/s</text>
    <rect x="250" y="198" width="660" height="34" rx="7" fill="#152027" stroke="#22323a"/>
    <rect x="250" y="198" width="325.877396993703" height="34" rx="7" fill="#5ce1b0"/>
    <text x="56" y="220" fill="#e7f2ea" font-size="15" font-weight="600">PRAETOR/1</text>
    <text x="585.877396993703" y="220" fill="#5ce1b0" font-size="15" font-weight="700">2,177</text>

    <rect x="250" y="250" width="660" height="34" rx="7" fill="#152027" stroke="#22323a"/>
    <rect x="250" y="250" width="611.1111111111111" height="34" rx="7" fill="#6aa9ff"/>
    <text x="56" y="272" fill="#e7f2ea" font-size="15" font-weight="600">WireGuard</text>
    <text x="871.1111111111111" y="272" fill="#6aa9ff" font-size="15" font-weight="700">4,082</text>
    <text x="984" y="220" fill="#8fa6a1" font-size="13" text-anchor="end">PRAETOR 0.53×</text>
  </g>
  
  <g>
    <text x="56" y="356" fill="#e7f2ea" font-size="19" font-weight="700">1 KiB authenticated roundtrips</text>
    <text x="56" y="378" fill="#8fa6a1" font-size="13">one cell or one WireGuard transport packet · roundtrips/s</text>
    <rect x="250" y="398" width="660" height="34" rx="7" fill="#152027" stroke="#22323a"/>
    <rect x="250" y="398" width="85.09250598393022" height="34" rx="7" fill="#5ce1b0"/>
    <text x="56" y="420" fill="#e7f2ea" font-size="15" font-weight="600">PRAETOR/1</text>
    <text x="345.0925059839302" y="420" fill="#5ce1b0" font-size="15" font-weight="700">129,805</text>

    <rect x="250" y="450" width="660" height="34" rx="7" fill="#152027" stroke="#22323a"/>
    <rect x="250" y="450" width="611.1111111111111" height="34" rx="7" fill="#6aa9ff"/>
    <text x="56" y="472" fill="#e7f2ea" font-size="15" font-weight="600">WireGuard</text>
    <text x="871.1111111111111" y="472" fill="#6aa9ff" font-size="15" font-weight="700">932,223</text>
    <text x="984" y="420" fill="#8fa6a1" font-size="13" text-anchor="end">PRAETOR 0.14×</text>
  </g>
  
  <g>
    <text x="56" y="556" fill="#e7f2ea" font-size="19" font-weight="700">60 KB full-path throughput</text>
    <text x="56" y="578" fill="#8fa6a1" font-size="13">fixed-cell framing vs WireGuard transport packet · MiB/s</text>
    <rect x="250" y="598" width="660" height="34" rx="7" fill="#152027" stroke="#22323a"/>
    <rect x="250" y="598" width="67.12266819712676" height="34" rx="7" fill="#5ce1b0"/>
    <text x="56" y="620" fill="#e7f2ea" font-size="15" font-weight="600">PRAETOR/1</text>
    <text x="327.12266819712676" y="620" fill="#5ce1b0" font-size="15" font-weight="700">131.1</text>

    <rect x="250" y="650" width="660" height="34" rx="7" fill="#152027" stroke="#22323a"/>
    <rect x="250" y="650" width="611.1111111111111" height="34" rx="7" fill="#6aa9ff"/>
    <text x="56" y="672" fill="#e7f2ea" font-size="15" font-weight="600">WireGuard</text>
    <text x="871.1111111111111" y="672" fill="#6aa9ff" font-size="15" font-weight="700">1193.2</text>
    <text x="984" y="620" fill="#8fa6a1" font-size="13" text-anchor="end">PRAETOR 0.11×</text>
  </g>
  <text x="56" y="750" fill="#8fa6a1" font-size="12">PRAETOR includes two-pass SIV, a 32-byte commitment tag, 80-byte fixed-cell framing and an ML-KEM-768 hybrid handshake.</text>
  <text x="56" y="768" fill="#8fa6a1" font-size="12">WireGuard is Cloudflare boringtun 0.7.1 userspace (NoiseIK, X25519, ChaCha20-Poly1305); no TUN/UDP, so these are protocol CPU costs, not VPN wall-clock.</text>
</svg>
